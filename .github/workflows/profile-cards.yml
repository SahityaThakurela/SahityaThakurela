name: Refresh GitHub profile cards

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - ".github/workflows/profile-cards.yml"
      - "Warm Studio Portrait in Black Hoodie.png"
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip fonttools pillow cairosvg

      - name: Fetch contribution data
        run: |
          mkdir -p data
          curl --fail --silent --show-error --location --retry 3 \
            "https://github-contributions-api.jogruber.de/v4/SahityaThakurela?y=last" \
            --output data/contributions.json

      - name: Render hero PNG
        run: python scripts/render_hero.py


      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/ data/contributions.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh profile cards"
            git push
          fi





















